[project]
logo = "docs/img/logo.png"
name = "fm9-tone"
status_file = "handsoff-status.json"
acceptance_file = "handsoff-acceptance.json"
event_log = "handsoff-events.jsonl"
verification_log = "handsoff-verifications.jsonl"

[workflow]
max_design_rounds = 3
max_review_rounds = 3
stall_minutes = 10
require_live_verification = true
# Pilot instruction 2026-09-19: no approval clicks in this repo; the independent
# design and implementation reviews and the live verification still gate every run.
deployment_requires_explicit_approval = false
require_design_approval = false

[execution]
# These waivers are deliberate for a solo, unattended project. Since the rule
# landed, configuration load refuses a waiver on any profile but dogfood, so
# declaring it here is what makes the existing [workflow] waivers legal. Before
# this, every Handsoff command on this project refused at config load.
profile = "dogfood"

[agents]
architect = "host"
supervisor = "host"
implementer = "codex"
reviewer = "codex"

[models]
architect = "default"
supervisor = "default"
implementer = "default"
reviewer = "default"


[workflow]
max_design_rounds = 3
max_review_rounds = 3
stall_minutes = 10
require_live_verification = true
deployment_requires_explicit_approval = true

[agents]
supervisor = "configure-me"
implementer = "configure-me"
reviewer = "configure-me"

[checks]
# Focused evidence commands for this two-repository tranche. The four Sound
# Check commands prove algorithms against deterministic fixtures only; they do
# not claim an FM9 capture or hardware validation.
commands = [
  ".venv/bin/python -m pytest tests/test_nam_captures.py tests/test_recipe_validation.py::test_tone_target_shape -q",
  ".venv/bin/python -m pytest tests/test_cab_recovery.py -q",
  "../ir-command/.venv/bin/python -m pytest ../ir-command/tests/test_reject_flow.py -q",
  "../ir-command/.venv/bin/python -m pytest ../ir-command/tests/test_target_routing.py::test_fm9_preparation_preserves_source_and_uses_truthful_profile -q",
  "../ir-command/.venv/bin/python -m pytest ../ir-command/tests/test_target_routing.py::test_same_request_routes_by_target_capability -q",
  "../ir-command/.venv/bin/python -m pytest ../ir-command/tests/test_target_routing.py::test_tonex_rejects_every_nam_architecture -q",
  ".venv/bin/python -m pytest tests/test_audio_metrics.py::test_frequency_balance_reports_named_bands_and_policy_status -q",
  ".venv/bin/python -m pytest tests/test_audio_metrics.py::test_scene_loudness_uses_rhythm_baseline_and_unknowns -q",
  ".venv/bin/python -m pytest tests/test_audio_metrics.py::test_stereo_and_dynamics_metrics_are_coverage_aware -q",
  ".venv/bin/python -m pytest tests/test_reference_compare.py -q",
  ".venv/bin/python -m pytest tests/test_offline_tranche_compat.py -q",
]
# This run has no hardware authority. Live verification means executing the
# shipped local entry points against deterministic WAVs and the simulator while
# retaining explicit `hardware_verified = false` coverage in every report.
live_commands = [
  "TONECOMMAND_SIM=1 .venv/bin/python tools/replay_recipe.py recipes/mesa-mark-v-a2-reference.json",
  "../ir-command/.venv/bin/python -m pytest ../ir-command/tests/test_reject_flow.py ../ir-command/tests/test_target_routing.py -q",
  ".venv/bin/python -m pytest tests/test_audio_metrics.py tests/test_reference_compare.py -q",
]
# Per-command timeout. A hanging check is killed and recorded as exit 124
# rather than hanging the Supervisor indefinitely.
timeout_seconds = 600

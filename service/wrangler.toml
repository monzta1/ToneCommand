# Deployment config for the sharing service.
#
# The worker holds an inbox and a counter, nothing else: recipe CONTENT lives
# in this repository's recipes/ folder. That split is what makes the failure
# mode acceptable. If this is down, browsing and using recipes still work,
# because the app reads them from GitHub; only submission and ranking pause,
# and the client holds both in a local outbox until it comes back.
#
# database_id is filled in by `wrangler d1 create tonecommand`, which prints
# it. It is not a secret: it names a database that only this worker's binding
# can reach, and Cloudflare authorises by account rather than by knowing the id.

name = "tonecommand-share"
main = "worker.js"
compatibility_date = "2026-08-31"

# Free tier is ample and is the point: 100k requests a day against a service
# that stores no content and is not on the critical path for anything.
workers_dev = true

[[d1_databases]]
binding = "DB"                 # env.DB in worker.js
database_name = "tonecommand"
database_id = "22e0e38f-ea37-4333-bf45-6452d5e435c9"

[vars]
# Off: a submission is queued and a human moves it into recipes/.
# "true": a submission is committed straight into recipes/ and is live for
# everyone immediately.
#
# Be clear-eyed about the second one. /submit is unauthenticated, so with
# auto-publish on, anyone who can reach this worker can write a file into a
# public repository under the owner's account. That is a deliberate choice
# while there are no users rather than an oversight, and it is one flag to
# undo: set it to "false" and redeploy, and the queue is back with nothing
# lost, because every submission is recorded in D1 either way.
AUTO_PUBLISH = "true"
RECIPE_REPO = "monzta1/ToneCommand"
RECIPE_BRANCH = "main"

# GITHUB_TOKEN is a SECRET, never a var, and never in this file:
#   npx wrangler secret put GITHUB_TOKEN
# A fine-grained token scoped to this one repository with Contents: write and
# nothing else. Without it, auto-publish falls back to queuing and says so.

[observability]
enabled = true
